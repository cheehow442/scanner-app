workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          cd v2
          flutter pub get
      - name: Build IPA
        script: |
          cd v2
          flutter build ipa --release --no-codesign
    artifacts:
      - v2/build/ios/ipa/*.ipa
